extends: "spectral:oas"

rules:

  # -----------------------------------------------------------------------
  # ISO 3166-1 Alpha-2 Country Code
  # Enforces that any schema named CountryAlpha2Code uses the canonical
  # two-uppercase-letter pattern, e.g. "CH", "US", "GB"
  # -----------------------------------------------------------------------
  country-alpha2-code-pattern:
    message: >
      CountryAlpha2Code.pattern must be '^[A-Z]{2}$' (ISO 3166-1 Alpha-2).
      Found: {{value}}
    description: >
      Enforces the canonical regex for ISO 3166-1 Alpha-2 country codes.
      Schema must be type: string with pattern '^[A-Z]{2}$'.
    severity: error
    given: "$.components.schemas.CountryAlpha2Code"
    then:
      - field: type
        function: enumeration
        functionOptions:
          values:
            - string
      - field: pattern
        function: enumeration
        functionOptions:
          values:
            - "^[A-Z]{2}$"

  # -----------------------------------------------------------------------
  # LEI — Legal Entity Identifier
  # ISO 17442:2019 — 18 alphanumeric characters followed by 2 check digits
  # e.g. 529900W18LQJJN6SJ336
  # -----------------------------------------------------------------------
  lei-type-pattern:
    message: >
      LeiType.pattern must be '^[A-Z0-9]{18}[0-9]{2}$' (ISO 17442:2019 LEI).
      Found: {{value}}
    description: >
      Enforces the canonical regex for Legal Entity Identifiers (LEI).
      Schema must be type: string with pattern '^[A-Z0-9]{18}[0-9]{2}$'.
    severity: error
    given: "$.components.schemas.LeiType"
    then:
      - field: type
        function: enumeration
        functionOptions:
          values:
            - string
      - field: pattern
        function: enumeration
        functionOptions:
          values:
            - "^[A-Z0-9]{18}[0-9]{2}$"

  # -----------------------------------------------------------------------
  # BIC — Business Identifier Code (8 or 11 characters)
  # ISO 9362:2014 — 4 alphanumeric institution + 2 uppercase country +
  # 2 alphanumeric location (not "00") + optional 3 alphanumeric branch
  # e.g. CITIUS33XXX
  # -----------------------------------------------------------------------
  any-bic-type-pattern:
    message: >
      AnyBicType.pattern must be '^[A-Z0-9]{4}[A-Z]{2}(?!00)[A-Z0-9]{2}([A-Z0-9]{3})?$'
      (ISO 9362:2014 BIC). Found: {{value}}
    description: >
      Enforces the canonical regex for Business Identifier Codes (BIC), 8 or 11
      characters. Allows alphanumeric bank codes per ISO 9362:2014, excluding
      the location code "00" (unconnected to SWIFT).
    severity: error
    given: "$.components.schemas.AnyBicType"
    then:
      - field: type
        function: enumeration
        functionOptions:
          values:
            - string
      - field: pattern
        function: enumeration
        functionOptions:
          values:
            - "^[A-Z0-9]{4}[A-Z]{2}(?!00)[A-Z0-9]{2}([A-Z0-9]{3})?$"
