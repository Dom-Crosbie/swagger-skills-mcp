extends:
  - "spectral:oas"

rules:

  # -----------------------------------------------------------------------
  # ISO 3166-1 Alpha-2 Country Code
  # Enforces that any schema named CountryAlpha2Code uses the canonical
  # two-uppercase-letter pattern, e.g. "CH", "US", "GB"
  # -----------------------------------------------------------------------
  sps-country-alpha2-code-pattern:
    description: "CountryAlpha2Code schema must use the canonical ISO 3166-1 Alpha-2 pattern."
    message: "CountryAlpha2Code.pattern must be '^[A-Z]{2}$' (ISO 3166-1 Alpha-2). Found: {{value}}"
    severity: error
    given: "$.components.schemas.CountryAlpha2Code"
    then:
      - field: type
        function: pattern
        functionOptions:
          match: "^string$"
      - field: pattern
        function: pattern
        functionOptions:
          match: "^\\^\\[A-Z\\]\\{2\\}\\$$"

  # -----------------------------------------------------------------------
  # LEI — Legal Entity Identifier
  # ISO 17442:2019 — 18 alphanumeric characters followed by 2 check digits
  # e.g. 529900W18LQJJN6SJ336
  # -----------------------------------------------------------------------
  sps-lei-type-pattern:
    description: "LeiType schema must use the canonical ISO 17442:2019 LEI pattern."
    message: "LeiType.pattern must be '^[A-Z0-9]{18}[0-9]{2}$' (ISO 17442:2019). Found: {{value}}"
    severity: error
    given: "$.components.schemas.LeiType"
    then:
      - field: type
        function: pattern
        functionOptions:
          match: "^string$"
      - field: pattern
        function: pattern
        functionOptions:
          match: "^\\^\\[A-Z0-9\\]\\{18\\}\\[0-9\\]\\{2\\}\\$$"

  # -----------------------------------------------------------------------
  # BIC — Business Identifier Code (8 or 11 characters)
  # ISO 9362:2014 — 4 alphanumeric institution + 2 uppercase country +
  # 2 alphanumeric location (not "00") + optional 3 alphanumeric branch
  # e.g. CITIUS33XXX
  # -----------------------------------------------------------------------
  sps-any-bic-type-pattern:
    description: "AnyBicType schema must use the canonical ISO 9362:2014 BIC pattern."
    message: "AnyBicType.pattern must be '^[A-Z0-9]{4}[A-Z]{2}(?!00)[A-Z0-9]{2}([A-Z0-9]{3})?$' (ISO 9362:2014). Found: {{value}}"
    severity: error
    given: "$.components.schemas.AnyBicType"
    then:
      - field: type
        function: pattern
        functionOptions:
          match: "^string$"
      - field: pattern
        function: pattern
        functionOptions:
          match: "^\\^\\[A-Z0-9\\]\\{4\\}\\[A-Z\\]\\{2\\}\\(\\?!00\\)\\[A-Z0-9\\]\\{2\\}\\(\\[A-Z0-9\\]\\{3\\}\\)\\?\\$$"
