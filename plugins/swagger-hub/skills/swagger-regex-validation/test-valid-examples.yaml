openapi: 3.0.3
info:
  title: Regex Validation Test - Valid Examples
  description: |
    Test spec with VALID examples that correctly match their regex patterns.
    Use this as a reference for correct implementations.
  version: 1.0.0
servers:
  - url: https://api.test.com/v1
paths:
  /test:
    get:
      summary: Test endpoint
      operationId: testEndpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResponse'
components:
  schemas:
    # VALID: Exactly 2 uppercase letters
    CountryAlpha2Code:
      description: Alpha-2 code of a country according to ISO 3166-1.
      pattern: '^[A-Z]{2}$'
      type: string
      example: CH
      
    # VALID: Other country codes
    CountryAlpha2Code_US:
      description: Alpha-2 code of a country according to ISO 3166-1.
      pattern: '^[A-Z]{2}$'
      type: string
      example: US
      
    CountryAlpha2Code_GB:
      description: Alpha-2 code of a country according to ISO 3166-1.
      pattern: '^[A-Z]{2}$'
      type: string
      example: GB

    # VALID: 18 alphanumeric + 2 digits = 20 characters total
    LeiType:
      description: 'The LEI (Legal Entity Identifier) according to ISO 17442:2019.'
      pattern: '^[A-Z0-9]{18}[0-9]{2}$'
      type: string
      example: 529900W18LQJJN6SJ336
      
    # VALID: Another valid LEI
    LeiType_UBS:
      description: 'The LEI (Legal Entity Identifier) according to ISO 17442:2019.'
      pattern: '^[A-Z0-9]{18}[0-9]{2}$'
      type: string
      example: BFM8T61CT2L1QCEMIK50

    # VALID: 11-character BIC with valid structure
    AnyBicType:
      description: Business Identifier Code (BIC) 8 or 11 according to ISO 9362:2014.
      pattern: '^[A-Z0-9]{4}[A-Z]{2}(?!00)[A-Z0-9]{2}([A-Z0-9]{3})?$'
      type: string
      example: CITIUS33XXX
      
    # VALID: 8-character BIC (without branch code)
    AnyBicType_8Char:
      description: Business Identifier Code (BIC) 8 or 11 according to ISO 9362:2014.
      pattern: '^[A-Z0-9]{4}[A-Z]{2}(?!00)[A-Z0-9]{2}([A-Z0-9]{3})?$'
      type: string
      example: CITIUS33
      
    # VALID: Swiss bank BIC
    AnyBicType_Swiss:
      description: Business Identifier Code (BIC) 8 or 11 according to ISO 9362:2014.
      pattern: '^[A-Z0-9]{4}[A-Z]{2}(?!00)[A-Z0-9]{2}([A-Z0-9]{3})?$'
      type: string
      example: UBSWCHZH80A

    TestResponse:
      type: object
      properties:
        message:
          type: string
          example: Test response
