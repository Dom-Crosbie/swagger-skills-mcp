openapi: 3.0.3
info:
  title: Regex Validation Test - Invalid Examples
  description: |
    Test spec with INVALID examples that do not match their regex patterns.
    Use this to test that validation correctly catches violations.
  version: 1.0.0
servers:
  - url: https://api.test.com/v1
paths:
  /test:
    get:
      summary: Test endpoint
      operationId: testEndpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResponse'
components:
  schemas:
    # INVALID: Only 1 character, pattern requires exactly 2
    CountryAlpha2Code_Invalid1:
      description: Alpha-2 code of a country according to ISO 3166-1.
      pattern: '^[A-Z]{2}$'
      type: string
      example: X
      
    # INVALID: 3 characters, pattern requires exactly 2  
    CountryAlpha2Code_Invalid2:
      description: Alpha-2 code of a country according to ISO 3166-1.
      pattern: '^[A-Z]{2}$'
      type: string
      example: CHE
      
    # INVALID: lowercase letters
    CountryAlpha2Code_Invalid3:
      description: Alpha-2 code of a country according to ISO 3166-1.
      pattern: '^[A-Z]{2}$'
      type: string
      example: ch
      
    # INVALID: Too short, doesn't match 18 alphanumeric + 2 digits
    LeiType_Invalid1:
      description: 'The LEI (Legal Entity Identifier) according to ISO 17442:2019.'
      pattern: '^[A-Z0-9]{18}[0-9]{2}$'
      type: string
      example: INVALID
      
    # INVALID: Last 2 chars should be digits, not letters
    LeiType_Invalid2:
      description: 'The LEI (Legal Entity Identifier) according to ISO 17442:2019.'
      pattern: '^[A-Z0-9]{18}[0-9]{2}$'
      type: string
      example: 529900W18LQJJN6SJ3AB
      
    # INVALID: Contains "00" in positions 7-8 which is disallowed by negative lookahead
    AnyBicType_Invalid1:
      description: Business Identifier Code (BIC) 8 or 11 according to ISO 9362:2014.
      pattern: '^[A-Z0-9]{4}[A-Z]{2}(?!00)[A-Z0-9]{2}([A-Z0-9]{3})?$'
      type: string
      example: CITIUS00XXX
      
    # INVALID: Country code (positions 5-6) contains digits
    AnyBicType_Invalid2:
      description: Business Identifier Code (BIC) 8 or 11 according to ISO 9362:2014.
      pattern: '^[A-Z0-9]{4}[A-Z]{2}(?!00)[A-Z0-9]{2}([A-Z0-9]{3})?$'
      type: string
      example: CITI1233XXX
      
    # INVALID: Too short - minimum 8 characters required
    AnyBicType_Invalid3:
      description: Business Identifier Code (BIC) 8 or 11 according to ISO 9362:2014.
      pattern: '^[A-Z0-9]{4}[A-Z]{2}(?!00)[A-Z0-9]{2}([A-Z0-9]{3})?$'
      type: string
      example: CITI

    TestResponse:
      type: object
      properties:
        message:
          type: string
          example: Test response
